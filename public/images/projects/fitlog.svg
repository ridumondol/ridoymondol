  <text x="300" y="281" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3</text>
  <text x="380" y="281" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">75 kg x 8</text>
